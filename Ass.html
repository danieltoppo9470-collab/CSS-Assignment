
<!DOCTYPE html>
<html>
<head>
    <title>EMart</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .login-box {
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: brown;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: brown;
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 10px;
            cursor: pointer;
        }

        footer {
            color: brown;
            font-size: 12px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>EMart</h1>

        <form>
            <input type="text" placeholder="Username" required>
            <br>

            <input type="password" placeholder="Password" required>
            <br>

            <button type="submit">Login</button>
            <br>

            <button type="button">Forgot Password</button>
        </form>

    </div>

    <footer>
        © 2026 EMart Shopping
    </footer>

</body>
</html>
